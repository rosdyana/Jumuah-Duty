# Copy env.example to .env and fill in real values before running.
# `docker compose up -d` brings up mysql (persistent volume), the Next.js app, and
# the daily reminder scheduler. Put a reverse proxy (e.g. Caddy) in front of the
# app's exposed port on the host.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-masjid}
      MYSQL_USER: ${MYSQL_USER:-masjid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-masjid}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      CRON_SECRET: ${CRON_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  scheduler:
    build:
      context: docker/scheduler
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}

volumes:
  mysql_data:
