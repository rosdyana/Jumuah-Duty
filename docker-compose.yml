# Local development database. The `app` and `scheduler` services are added in the
# Dockerization milestone (M11) for full-stack deployment.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-masjid}
      MYSQL_USER: ${MYSQL_USER:-masjid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-masjid}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
